name: Quality

# Lint, unit tests, cross-language answer verification, the research study, end-to-end browser
# tests with accessibility checks, and Lighthouse scores. Runs on every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests (generators, simulations, security, coach)
        run: npm test

  verify-and-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt
      - name: Cross-check every interview answer against an independent Python derivation
        run: |
          node tests/export-answers.js > answers.json
          python research/verify_results.py --js answers.json
      - name: Learner-model study (quick run)
        run: python research/learner_models.py --quick

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone) with axe accessibility checks
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lighthouse (accessibility, best practices, SEO, performance)
        run: npx lhci autorun
