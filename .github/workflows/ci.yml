name: Quality

# Lint, unit tests, cross-language answer verification, the research study, end-to-end browser
# tests with accessibility checks, and Lighthouse scores. Runs on every push and pull request.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests (generators, simulations, security, coach)
        run: npm test

  verify-and-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r research/requirements.txt
      - name: Cross-check every interview answer against an independent Python derivation
        run: |
          node tests/export-answers.js > answers.json
          python research/verify_results.py --js answers.json
      - name: Cross-check every coding problem's Python reference, and a brute-force version, on every test case
        run: |
          node tests/export-code.js > code.json
          python research/verify_code.py code.json
      - name: Re-derive every numeric answer in the Citadel SSE questions
        run: |
          node tests/export-sse.js > sse.json
          python research/verify_sse.py sse.json
      - name: Check every testable claim about Python behaviour on the internals cards and quiz
        run: python research/verify_internals.py
      - name: Quant dev handbook listings
        run: python research/verify_devbook.py
      - name: Code in the handbooks' model answers compiles, and runs against tests
        run: |
          node tests/export-models.js > models.json
          python research/verify_models.py models.json
      - name: Data drills (model solutions pass, starters and common mistakes fail)
        run: |
          node tests/export-data.js > data.json
          python research/verify_data.py data.json
      - name: Data drills and data-tools listings on the browser's versions (Pyodide's numpy, pandas, Polars)
        run: |
          python -m venv /tmp/browser-py
          /tmp/browser-py/bin/pip install -q -r research/requirements-browser.txt
          /tmp/browser-py/bin/python research/verify_data.py data.json
          /tmp/browser-py/bin/python research/verify_devbook.py
      - name: Learner-model study (quick run)
        run: python research/learner_models.py --quick

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (desktop + phone) with axe accessibility checks
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lighthouse (accessibility, best practices, SEO, performance)
        run: npx lhci autorun
