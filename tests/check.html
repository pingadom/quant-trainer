</head>
<body>
  <h1>Theo checks</h1>
  <p>Serve the project root (<code>npm run serve</code>) and open <code>/tests/check.html</code>. The same suite runs in CI with <code>npm test</code>.</p>
  <pre id="out">Running…</pre>

  <script src="checks.js"></script>
  <script>
    (async () => {
      const text = (p) => fetch(p, { cache: 'no-store' }).then((r) => (r.ok ? r.text() : undefined)).catch(() => undefined);
      const files = { index: await text('../www/index.html'), sw: await text('../www/sw.js'), pkg: await text('../package.json') };
      const { lines, fails } = runChecks(QT, files);
      const el = document.getElementById('out');
      el.textContent = lines.join('\n');
      el.className = fails ? 'fail' : 'pass';
      document.title = fails ? 'FAIL' : 'PASS';
    })();
  </script>
