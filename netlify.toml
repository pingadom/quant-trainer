# Netlify: static site, no build step. (Cloudflare Pages: set the output directory to "www".)
[build]
  publish = "www"
  command = "node tests/run-node.js"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be cached, or users can get stuck on an old version.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
